# ---------------------------------------------------------------------------
# Consultas para evaluar la recuperación de los LIBROS (fase 2 de
# PLAN_INDEXAR_LIBROS.md): qué secciones de guias/secciones.jsonl responden
# cada consulta. Se anota por SECCIÓN, no por fragmento, para que todas las
# configuraciones de fragmentación se midan con la misma vara.
#
#     2 = la sección responde la consulta
#     1 = relacionada (contexto útil, no la respuesta)
#
# Propuesta de Claude (07/10/2026) a partir del índice de secciones.
# PENDIENTE: validación del usuario o del médico. Al validar, mover, quitar
# o agregar IDs; el comentario de cada línea es el título de la sección.
#
# Las de trauma repiten el `id` y el texto de eval/consultas.yaml. Las de
# procedimiento (proc-*) son nuevas: preguntas que responde un libro y no un
# caso. Las fuera de dominio (neg-*) no tienen relevantes.
#
# ATLS 10.ª ed. en español (23/10/2026, PLAN_INDEXAR_ATLS10.md, fase 2): cada
# consulta lleva al final su bloque `ATLS10-*`, propuesto por Claude desde el
# índice de secciones y los candidatos de la búsqueda (densa + reranker).
# También falta validarlo. scripts/calibrar_guias.py solo cuenta los libros
# que están en el índice: hasta que el ATLS 10 se indexe, su bloque no cambia
# las cifras. neg-11 a neg-20 son nuevas (las mismas en eval/consultas.yaml).
# ---------------------------------------------------------------------------

